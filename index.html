<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- تم إضافة الوصف التعريفي هنا لحل مشكلة الـ SEO تماماً -->
    <meta name="description" content="Welcome to SFV-X Games - Explore and enter the ultimate gaming world with multiple language support.">
    
    <!-- تحسين محركات البحث والكلمات المفتاحية -->
    <meta name="keywords" content="SFV-X Games, online games, gaming platform, play games">
    <meta name="author" content="SFV-X Games">

    <title id="pageTitle">SFV-X Games - Welcome</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 40px;
            background: #161b22;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 480px;
            width: 90%;
        }
        h1 {
            margin-bottom: 15px;
            color: #58a6ff;
            font-size: 28px;
        }
        p {
            color: #8b949e;
            margin-bottom: 25px;
            font-size: 16px;
        }
        .btn {
            display: inline-block;
            background-color: #238636;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #2ea043;
        }
        .lang-badge {
            margin-top: 20px;
            font-size: 12px;
            color: #484f58;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="welcomeText">Welcome to SFV-X Games</h1>
        <p id="descText">Click below to enter the gaming world</p>
        <a href="games/01-Entry/games-entry.html" class="btn" id="btnText">Enter / دخول</a>
        <div class="lang-badge" id="detectedLang">Auto-detected Language</div>
    </div>

    <script>
        // قاموس الترجمات المصغر لصفحة الترحيب بناءً على اللغات اللي عندك
        const welcomeTranslations = {
            ar: { 
                welcome: "مرحباً بك في منصة SFV-X Games", 
                desc: "اضغط بالأسفل للدخول إلى عالم الألعاب", 
                btn: "دخول الألعاب", 
                dir: "rtl",
                metaDesc: "مرحباً بك في منصة SFV-X Games - استكشف وادخل إلى عالم الألعاب الممتع."
            },
            en: { 
                welcome: "Welcome to SFV-X Games", 
                desc: "Click below to enter the gaming world", 
                btn: "Enter Games", 
                dir: "ltr",
                metaDesc: "Welcome to SFV-X Games - Explore and enter the ultimate gaming world."
            },
            es: { 
                welcome: "Bienvenido a SFV-X Games", 
                desc: "Haz clic abajo para entrar al mundo de los juegos", 
                btn: "Entrar", 
                dir: "ltr",
                metaDesc: "Bienvenido a SFV-X Games - Entra al mundo de los juegos."
            },
            fr: { 
                welcome: "Bienvenue sur SFV-X Games", 
                desc: "Cliquez ci-dessous pour entrer dans le monde du jeu", 
                btn: "Entrer", 
                dir: "ltr",
                metaDesc: "Bienvenue sur SFV-X Games - Entrez dans le monde du jeu."
            },
            de: { 
                welcome: "Willkommen bei SFV-X Games", 
                desc: "Klicken Sie unten, um die Spielewelt zu betreten", 
                btn: "Spielen", 
                dir: "ltr",
                metaDesc: "Willkommen bei SFV-X Games - Betreten Sie die Spielewelt."
            },
            pt: { 
                welcome: "Bem-vindo ao SFV-X Games", 
                desc: "Clique abaixo para entrar no mundo dos jogos", 
                btn: "Entrar", 
                dir: "ltr",
                metaDesc: "Bem-vindo ao SFV-X Games - Entre no mundo dos jogos."
            },
            ru: { 
                welcome: "Добро пожаловать в SFV-X Games", 
                desc: "Нажмите ниже, чтобы войти в игровой мир", 
                btn: "Войти", 
                dir: "ltr",
                metaDesc: "Добро пожаловать в SFV-X Games - Войдите в игровой мир."
            },
            tr: { 
                welcome: "SFV-X Games'e Hoş Geldiniz", 
                desc: "Oyun dünyasına girmek için aşağıya tıklayın", 
                btn: "Giriş", 
                dir: "ltr",
                metaDesc: "SFV-X Games'e Hoş Geldiniz - Oyun dünyasına giriş yapın."
            },
            zh: { 
                welcome: "欢迎来到 SFV-X Games", 
                desc: "点击下方进入游戏世界",
                btn: "进入", 
                dir: "ltr",
                metaDesc: "欢迎来到 SFV-X Games - 进入精彩的游戏世界。"
            }
        };

        // الكشف عن لغة متصفح الزائر
        let browserLang = navigator.language || navigator.userLanguage;
        let langCode = browserLang.split('-')[0]; // تحويل مثل 'ar-EG' إلى 'ar'

        // لو اللغة مش موجودة في القاموس، نحولها إنجليزي (en) تلقائياً
        if (!welcomeTranslations[langCode]) {
            langCode = 'en';
        }

        // تطبيق الترجمة والتصميم على الصفحة تلقائياً
        const t = welcomeTranslations[langCode];
        document.getElementById('htmlTag').setAttribute('lang', langCode);
        document.getElementById('htmlTag').setAttribute('dir', t.dir);
        document.getElementById('welcomeText').innerText = t.welcome;
        document.getElementById('descText').innerText = t.desc;
        document.getElementById('btnText').innerText = t.btn;
        document.getElementById('detectedLang').innerText = "Language: " + langCode.toUpperCase();

        // تحديث الوصف التعريفي (Meta Description) ديناميكياً حسب لغة المستخدم لجعل الـ SEO مثالي 100%
        document.querySelector('meta[name="description"]').setAttribute('content', t.metaDesc);
    </script>
</body>
</html>
